<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120f0f" />
  <meta name="description" content="Aplicativo oficial do Real Império FC, Indianópolis, Caruaru-PE." />
  <title>Real Império FC</title>
  <link rel="icon" href="assets/logo-real-imperio.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="lineup.css" />
  <style>
    .site-footer {
      width: 100%;
      margin-top: 20px;
      border-top: 1px solid rgba(227,179,92,.22);
      background: linear-gradient(180deg, rgba(9,7,7,.86), rgba(7,6,6,.98));
      backdrop-filter: blur(14px);
    }
    .site-footer-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 92px;
      margin: 0 auto;
      padding: 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .site-footer-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .site-footer-brand img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(227,179,92,.55);
    }
    .site-footer-copy strong {
      display: block;
      font-family: Oswald, sans-serif;
      letter-spacing: .04em;
      color: var(--cream);
    }
    .site-footer-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.45;
    }
    .developer-credit {
      color: var(--muted);
      font-size: .8rem;
      text-align: right;
      white-space: nowrap;
    }
    .developer-credit a {
      color: var(--gold-2);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: .2s ease;
    }
    .developer-credit a:hover,
    .developer-credit a:focus-visible {
      color: var(--white);
      border-bottom-color: var(--gold);
    }
    @media (max-width: 720px) {
      .site-footer {
        margin-bottom: 72px;
      }
      .site-footer-inner {
        min-height: auto;
        padding: 20px 0 22px;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .developer-credit {
        width: 100%;
        text-align: left;
        white-space: normal;
        padding-left: 54px;
      }
    }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <header class="topbar">
    <div class="brand" data-nav="home" role="button" tabindex="0" aria-label="Ir para o início">
      <img src="assets/logo-real-imperio.svg" alt="Escudo Real Império FC" />
      <div>
        <strong>REAL IMPÉRIO FC</strong>
        <span>Indianópolis · Caruaru-PE</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="account-btn" type="button">Entrar</button>
      <button class="btn btn-gold admin-only hidden" id="admin-btn" type="button">Painel Admin</button>
    </div>
  </header>

  <nav class="desktop-nav" aria-label="Navegação principal">
    <button class="nav-item active" data-nav="home">Início</button>
    <button class="nav-item" data-nav="agenda">Agenda</button>
    <button class="nav-item" data-nav="team">O Time</button>
    <button class="nav-item" data-nav="players">Jogadores</button>
    <button class="nav-item" data-nav="extras">Extras</button>
    <button class="nav-item" data-nav="register">Cadastro</button>
  </nav>

  <main class="app-shell">
    <section id="view-home" class="view active-view"></section>
    <section id="view-agenda" class="view"></section>
    <section id="view-team" class="view"></section>
    <section id="view-players" class="view"></section>
    <section id="view-extras" class="view"></section>
    <section id="view-register" class="view"></section>
    <section id="view-account" class="view"></section>
    <section id="view-admin" class="view"></section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="site-footer-brand">
        <img src="assets/logo-real-imperio.svg" alt="Escudo Real Império FC" />
        <div class="site-footer-copy">
          <strong>REAL IMPÉRIO FC</strong>
          <span>© 2026 Real Império FC. Todos os direitos reservados.</span>
        </div>
      </div>
      <div class="developer-credit">
        Desenvolvido por
        <a href="https://www.facebook.com/profile.php?id=61589798115664" target="_blank" rel="noopener noreferrer" aria-label="Facebook do desenvolvedor Erick Israel">Erick Israel</a>
      </div>
    </div>
  </footer>

  <nav class="mobile-nav" aria-label="Navegação móvel">
    <button class="mobile-nav-item active" data-nav="home"><span>⌂</span><small>Início</small></button>
    <button class="mobile-nav-item" data-nav="agenda"><span>◷</span><small>Agenda</small></button>
    <button class="mobile-nav-item" data-nav="players"><span>⚽</span><small>Elenco</small></button>
    <button class="mobile-nav-item" data-nav="extras"><span>▣</span><small>Fotos</small></button>
    <button class="mobile-nav-item" data-nav="register"><span>＋</span><small>Cadastro</small></button>
  </nav>

  <dialog id="modal" class="modal">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" type="button" aria-label="Fechar">×</button>
      <div id="modal-content"></div>
    </div>
  </dialog>

  <template id="empty-state-template">
    <div class="empty-state">
      <div class="empty-icon">⚽</div>
      <h3>Nada por aqui ainda</h3>
      <p>Assim que houver novidades, elas aparecerão nesta área.</p>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
