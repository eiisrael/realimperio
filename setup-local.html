<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração local — Real Império FC</title><link rel="stylesheet" href="styles.css"></head><body><div class="page-bg"></div><main class="app-shell"><article class="card form-card" style="margin-top:40px"><span class="kicker">Somente ambiente local</span><h1 style="font-family:Oswald,sans-serif">Configurar administradores</h1><p class="team-story">Esta tela grava apenas hashes das credenciais no armazenamento do seu navegador. As credenciais não são publicadas no GitHub. Use-a apenas em <strong>localhost</strong>.</p><form id="setup"><div class="form-grid"><div class="field full"><h3>Administrador total</h3></div><div class="field"><label>E-mail</label><input name="superEmail" type="email" required></div><div class="field"><label>Senha</label><input name="superPass" type="password" required minlength="6"></div><div class="field full"><h3>Administrador geral</h3></div><div class="field"><label>E-mail</label><input name="adminEmail" type="email" value="italorodrigo550@gmail.com" required></div><div class="field"><label>Senha</label><input name="adminPass" type="password" required minlength="6"></div></div><div class="form-actions"><a class="btn btn-dark" href="index.html">Voltar</a><button class="btn btn-gold">Salvar no navegador</button></div></form><p id="status" class="form-help"></p></article></main><script type="module">import{sha256,setLocalAdmins}from'./js/state.js';const ok=['localhost','127.0.0.1','[::1]'].includes(location.hostname);if(!ok){document.querySelector('form').remove();document.querySelector('#status').textContent='Por segurança, esta configuração só funciona em localhost.'}document.querySelector('#setup')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);setLocalAdmins([{emailHash:await sha256(f.get('superEmail')),passwordHash:await sha256(f.get('superPass')),role:'superadmin'},{emailHash:await sha256(f.get('adminEmail')),passwordHash:await sha256(f.get('adminPass')),role:'admin'}]);document.querySelector('#status').textContent='Administradores configurados neste navegador. Você já pode voltar e entrar.'})</script></body></html>
